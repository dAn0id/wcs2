name: Release WCS2 (Linux x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine release tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9] ]]; then
            echo "::error::Release tag must start with 'v' followed by a version number (e.g. v1.0.1). Got: '${TAG}'"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using release tag: ${TAG}"

      - name: Restore & publish Linux x64 bundle
        shell: bash
        run: |
          dotnet publish src/WCS2/WCS2.csproj \
            -c Release \
            -r linux-x64 \
            --no-self-contained \
            -o stage/WCS2

      - name: Verify published bundle integrity
        shell: bash
        run: |
          set -euo pipefail
          test -f stage/WCS2/WCS2.dll
          test -f stage/WCS2/libe_sqlite3.so
          test -f stage/WCS2/Microsoft.Data.Sqlite.dll
          test -f stage/WCS2/Dapper.dll
          test -f stage/WCS2/defaults/configs/wcs.json
          test -f stage/WCS2/defaults/configs/gamedata.json
          test -f stage/WCS2/defaults/configs/items.json
          test -f stage/WCS2/defaults/configs/races/wcs2-race-builder.py
          chmod +x stage/WCS2/defaults/configs/races/wcs2-race-builder.py
          test -x stage/WCS2/defaults/configs/races/wcs2-race-builder.py
          RACE_COUNT=$(find stage/WCS2/defaults/configs/races -maxdepth 1 -name '*.json' | wc -l)
          echo "Bundled default race JSON files: ${RACE_COUNT}"
          test "${RACE_COUNT}" -ge 11
          # Ensure no top-level configs/ directory is shipped so updates never overwrite admin configs
          test ! -e stage/WCS2/configs
          # Ensure runtime-provided CSS / shared DLLs are NOT duplicated inside plugin folder
          test ! -f stage/WCS2/CounterStrikeSharp.API.dll
          test ! -f stage/WCS2/CS2MenuManager.dll
          ls -la stage/WCS2 stage/WCS2/defaults/configs

      - name: Package release archives
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ZIP_NAME="WCS2-${RELEASE_TAG}-linux-x64.zip"
          TAR_NAME="WCS2-${RELEASE_TAG}-linux-x64.tar.gz"
          (cd stage && zip -rq "../dist/${ZIP_NAME}" WCS2)
          tar -C stage -czf "dist/${TAR_NAME}" WCS2
          (cd dist && sha256sum "${ZIP_NAME}" "${TAR_NAME}" > SHA256SUMS.txt)
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          ZIP_PATH="dist/WCS2-${RELEASE_TAG}-linux-x64.zip"
          TAR_PATH="dist/WCS2-${RELEASE_TAG}-linux-x64.tar.gz"
          SUMS_PATH="dist/SHA256SUMS.txt"

          NOTES=$(cat <<EOF
          ## WCS2 ${RELEASE_TAG} (Linux x64)

          Prebuilt CounterStrikeSharp plugin bundle for **Counter-Strike 2 Linux x86_64 dedicated servers** (CounterStrikeSharp \`v1.0.381+\` with \`.NET 10.0\` runtime + \`CS2MenuManager v1.0.43+\`).

          ### Quick Install / Safe Update
          1. Ensure **Metamod:Source 2.0**, **CounterStrikeSharp \`v1.0.381+\`** (\`with-runtime\`), and **\`CS2MenuManager\`** (\`shared/CS2MenuManager/\`) are installed.
          2. Extract \`WCS2-${RELEASE_TAG}-linux-x64.zip\` (or \`.tar.gz\`) directly into:
             \`game/csgo/addons/counterstrikesharp/plugins/\`
             so that \`plugins/WCS2/WCS2.dll\`, \`libe_sqlite3.so\`, and \`defaults/configs/\` are extracted cleanly.
             Missing default configs are seeded automatically into \`plugins/WCS2/configs/\` on startup — **existing customized files in \`configs/\` and \`data/\` are never overwritten**!
          3. Configure admins in \`addons/counterstrikesharp/configs/admins.json\` (or \`plugins/WCS2/configs/wcs.json\` -> \`admin_steam_ids\`).
          4. Restart your CS2 server and verify \`css_plugins list\`.

          See the [README Setup Guide](https://github.com/${GITHUB_REPOSITORY}#setup) for full details.
          EOF
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${ZIP_PATH}" "${TAR_PATH}" "${SUMS_PATH}" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "${ZIP_PATH}" "${TAR_PATH}" "${SUMS_PATH}" \
              --title "WCS2 ${RELEASE_TAG} (Linux x64)" \
              --notes "${NOTES}"
          fi
